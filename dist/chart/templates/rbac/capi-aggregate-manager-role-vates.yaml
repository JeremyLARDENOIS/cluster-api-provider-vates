apiVersion: rbac.authorization.k8s.io/v1
{{- if .Values.rbac.namespaced }}
kind: Role
{{- else }}
kind: ClusterRole
{{- end }}
metadata:
{{- if .Values.rbac.namespaced }}
  namespace: {{ .Release.Namespace }}
{{- end }}
  labels:
    cluster.x-k8s.io/aggregate-to-manager: "true"
  name: {{ include "vates-capi.resourceName" (dict "suffix" "capi-aggregate-manager-role-vates" "context" $) }}
rules:
- apiGroups:
  - vates.infrastructure.cluster.x-k8s.io
  resources:
  - '*'
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
