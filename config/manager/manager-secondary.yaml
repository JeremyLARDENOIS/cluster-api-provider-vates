apiVersion: v1
kind: Namespace
metadata:
  name: capi-system-2
---
apiVersion: v1
kind: Secret
metadata:
  name: xo-credentials
  namespace: capi-system-2
type: Opaque
stringData:
  url: "https://192.168.122.225"
  token: "xNghGhbTweF0fm1j4Dgxwhwntc-85B4cK-HYc85rKm8"
  insecure: "true"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vates-capi-controller-manager
  namespace: capi-system-2
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: vates-capi-manager-rolebinding-2
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: vates-capi-manager-role
subjects:
  - kind: ServiceAccount
    name: vates-capi-controller-manager
    namespace: capi-system-2
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: leader-election-role
  namespace: capi-system-2
rules:
- apiGroups:
  - coordination.k8s.io
  resources:
  - leases
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
  - delete
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: leader-election-rolebinding
  namespace: capi-system-2
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: leader-election-role
subjects:
- kind: ServiceAccount
  name: vates-capi-controller-manager
  namespace: capi-system-2
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vates-capi-controller-manager
  namespace: capi-system-2
  labels:
    control-plane: controller-manager
    app.kubernetes.io/name: vates-capi
    app.kubernetes.io/managed-by: kustomize
spec:
  selector:
    matchLabels:
      control-plane: controller-manager
      app.kubernetes.io/name: vates-capi
  replicas: 1
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: manager
      labels:
        control-plane: controller-manager
        app.kubernetes.io/name: vates-capi
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - command:
        - /manager
        args:
          - --leader-elect
          - --health-probe-bind-address=:8081
          - --xoa-secret-name=xo-credentials
          - --xoa-secret-namespace=capi-system-2
        image: ghcr.io/vatesfr/cluster-api-provider-vates:latest
        imagePullPolicy: IfNotPresent
        name: manager
        ports:
        - containerPort: 8081
          name: health
          protocol: TCP
        securityContext:
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - "ALL"
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8081
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8081
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          limits:
            cpu: 500m
            memory: 128Mi
          requests:
            cpu: 10m
            memory: 64Mi
        env:
          - name: XOA_INSECURE
            value: "true"
        volumeMounts: []
      volumes: []
      serviceAccountName: vates-capi-controller-manager
      terminationGracePeriodSeconds: 10
